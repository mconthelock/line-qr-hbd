<!DOCTYPE html>
<html>

<head>
    <title>Report</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="sweetalert2.min.css">
</head>

<style>
    body {
        font-size: 16px;
    }

    .container {
        display: flex;
        justify-content: center;
        width: 100%;
        padding: 10px;
    }

    .card {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 20px;
        max-width: 400px;
        width: 100%;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    #title {
        text-align: center;
        margin-bottom: 2rem;
        font-size: 24px;
    }

    .field {
        margin-bottom: 15px;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        width: 100%;
    }

    .field label {
        margin-bottom: 5px;
        font-weight: bold;
    }

    .field input {
        padding: 8px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    button {
        padding: 10px;
        font-size: 16px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    @media screen and (max-width: 480px) {
        .card {
            max-width: 90%;
            margin: 0 auto;
        }
    }
</style>

<body>

    <div class="container">
        <div class="card">
            <div id="title">Report</div>
            <div class="field">
                <input type="month" name="month" id="month">
                <button type="button" id="submit">Submit</button>
            </div>
        </div>
    </div>

    <script src="sweetalert2.all.min.js"></script>
    <script>
        // ใส่ URL ของ Google Script ของคุณที่นี่
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxT67UJS6WipWfiI6VbUpOx9X44S6ngFzRm37SeZQfbQ-gzBsyl6lDKhID0RyI7CR5hDw/exec";
        const LIFF_ID = "YOUR_LIFF_ID";

        async function getReport(month, year) {
            const res = await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                },
                body: JSON.stringify({
                    action: "get",
                    month: month,
                    year: year
                }),
            });
            if (!res.ok) {
                throw new Error(`HTTP error! status: ${res.status}`);
            }
            return res.json();
        }

        document.getElementById('submit').addEventListener('click', async () => {
            try{
                const my = document.getElementById('month').value;
                if(!my){
                    showMessage("กรุณาเลือกเดือน", 'warning');
                    return;
                }
                var [year, month] = my.split("-");
                month = month.startsWith("0") ? month.replace("0", "") : month;
                const data = await getReport(month, year);
                console.log(data, data.status);
                
                if(!data.status){
                    showMessage(data.message, 'warning');
                    return;
                }
            } catch (error) {
                showMessage("เกิดข้อผิดพลาด: " + error.message);
            }
        });

        function showMessage(message, type = "error") {
            Swal.fire({
                position: "bottom-end",
                title: type == 'error' ? 'Error' : (type == 'success' ? 'Success' : 'Warning!'),
                text: message,
                icon: type,
                showConfirmButton: false,
                timer: 3000,
                timerProgressBar: true,
                toast: true
            })
        }
        

    </script>
</body>

</html>
