<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan QR Code</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script> -->
    <script src="html5-qrcode.min.js" type="text/javascript"></script>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #222;
            color: white;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            padding: 10px;
        }

        .success {
            color: #4CAF50;
            font-weight: bold;
        }

        .error {
            color: #FF5722;
            font-weight: bold;
        }

        #loading {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h3 style="margin-top: 20px;">สแกน QR Code เพื่อตรวจสอบ</h3>
    <div id="reader"></div>
    <div id="loading">กำลังตรวจสอบข้อมูล...</div>
    <div id="result"></div>
    <button onclick="startScanner()">Scan QR Code</button>

    <script>
        // ใส่ URL ของ Google Script ของคุณที่นี่
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxKsd5Iy8GbKqYDZ3MFfh1rFkJOgutVpIr8we1dARuka7i1cDYBuaSU4Q3pSqIlszhAOA/exec";
        const LIFF_ID = "2008595384-42wB37LX";
        let html5QrCode = null;
        let scanned = false;

        async function main() {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }
            startScanner();
            // scanQRCode();
        }

        async function scanQRCode() {
            try {
                const result = await liff.scanCodeV2();
                document.querySelector('#result').innerHTML = `UUID: ${result.value}`;
            } catch (error) {
                console.log('scanCodeV2', error);
            }
        }

        function startScanner() {
            scanned = false;
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 60, qrbox: { width: 250, height: 250 } };
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
        }

        function onScanSuccess(decodedText) {
            // If we've already handled a scan, ignore further callbacks
            if (scanned) return;
            scanned = true;

            // Stop this instance (not the class) and then clear the UI
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    // clear UI elements inserted by the library
                    html5QrCode.clear();

                    document.getElementById('reader').style.display = 'none';
                    // Now you can call checkUUID or other handling once
                    checkUUID(decodedText);
                }).catch(err => {
                    console.error('Error stopping scanner:', err);
                });
            } else {
                // Fallback: hide reader and mark scanned
                document.getElementById('reader').style.display = 'none';
            }
        }

        function checkUUID(uuid) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').innerHTML = `UUID: ${uuid}`;
            const script = document.createElement('script');
            const callbackName = 'receiveData';
            script.src = `${GOOGLE_SCRIPT_URL}?uuid=${encodeURIComponent(uuid)}&callback=${callbackName}`;
            script.onerror = () => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('result').innerHTML = `<span class="error">❌ เชื่อมต่อไม่ได้ (ตรวจสอบ URL Script)</span>`;
            };
            document.body.appendChild(script);
        }

        function receiveData(res) {
            document.getElementById('loading').style.display = 'none';
            const resultDiv = document.getElementById('result');
            if (res.status == "OK") {
                let str = `<h1>บันทึกข้อมูลสำเร็จ</h1>`;
                str += `<p>ชื่อ: ${res.data.empname}</p>`;
                str += `<p>${res.data.empno}</p>`;
                resultDiv.innerHTML = str;
            } else if (res.status == "USED") {
                resultDiv.innerHTML = `<h1>ถูกใช้ไปแล้ว</h1>`;
            } else if (res.status == "NOT_FOUND") {
                resultDiv.innerHTML = `<h1>ไม่พบข้อมูล</h1>`;
            } else {
                resultDiv.innerHTML = `<h1>เกิดข้อผิดพลาด</h1>`;
            }
            return;
        }

        function sendMessageToLine(msg) {
            if (liff.isInClient()) {
                liff.sendMessages([{ type: 'text', text: msg }])
                    .then(() => setTimeout(() => liff.closeWindow(), 2000));
            }
        }

        main();
    </script>
</body>

</html>
