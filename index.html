<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan QR Code</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; text-align: center; margin: 0; padding: 0; background-color: #222; color: white; }
        #reader { width: 100%; max-width: 500px; margin: 0 auto; }
        #result { margin-top: 20px; font-size: 18px; padding: 10px; }
        .success { color: #4CAF50; font-weight: bold; }
        .error { color: #FF5722; font-weight: bold; }
        #loading { display: none; margin-top: 20px;}
    </style>
</head>
<body>

    <h3 style="margin-top: 20px;">สแกน QR Code เพื่อตรวจสอบ</h3>
    <div id="reader"></div>
    <div id="loading">กำลังตรวจสอบข้อมูล...</div>
    <div id="result"></div>

    <script>
        // ใส่ URL ของ Google Script ของคุณที่นี่
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxT67UJS6WipWfiI6VbUpOx9X44S6ngFzRm37SeZQfbQ-gzBsyl6lDKhID0RyI7CR5hDw/exec";
        const LIFF_ID = "YOUR_LIFF_ID";

        async function main() {
            // await liff.init({ liffId: LIFF_ID });
            // if (!liff.isLoggedIn()) {
            //     liff.login();
            //     return;
            // }
            // startScanner();
            checkUUID('22222');
        }

        function startScanner() {
            const html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
        }

        function onScanSuccess(decodedText) {
            Html5Qrcode.stop().then(() => {
                document.getElementById('reader').style.display = 'none';
                checkUUID(decodedText);
            });
        }

        function checkUUID(uuid) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').innerHTML = `UUID: ${uuid}`;

            // เรียกใช้เทคนิค JSONP (สร้าง Script Tag)
            const script = document.createElement('script');
            // ส่ง uuid และบอกชื่อฟังก์ชัน callback ที่จะให้ Google Script เรียกกลับมา
            const callbackName = 'receiveData_' + Date.now();

           // Timeout Failsafe: จับเวลา 10 วินาที ถ้า Server ไม่เรียกกลับมา ให้แจ้ง Error
            // (กรณีนี้มักเกิดจาก GAS ส่ง JSON ธรรมดามา ไม่ใช่ JSONP หรือลืม Deploy ใหม่)
            const timeoutId = setTimeout(() => {
                if (window[callbackName]) {
                    // ล้างค่าทิ้ง
                    delete window[callbackName];
                    if (document.body.contains(script)) {
                        document.body.removeChild(script);
                    }
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('result').innerHTML = `
                        <span class="error">❌ หมดเวลาเชื่อมต่อ (Timeout)</span><br>
                        <small style="font-size:12px; color:#ccc;">
                            Server ไม่ตอบกลับในรูปแบบ JSONP<br>
                            ตรวจสอบว่า Deploy Google Script เป็นเวอร์ชันล่าสุดแล้วหรือยัง
                        </small>`;
                }
            }, 10000);

            // สร้างฟังก์ชัน Global รอรับค่า
            window[callbackName] = function(data) {
                // ยกเลิกตัวจับเวลา เพราะได้รับข้อมูลแล้ว
                clearTimeout(timeoutId);

                console.log("Data received:", data); // Debug ดูค่าที่ได้รับ
                handleResponse(data.status);

                // ล้างทิ้งเมื่อเสร็จ
                delete window[callbackName];
                if (document.body.contains(script)) {
                    document.body.removeChild(script);
                }
            };

            // สร้าง URL และแปะ Script ลงในหน้าเว็บ
            // สังเกตว่าเราใช้ ?callback=... เพื่อบอกชื่อฟังก์ชัน
            script.src = `${GOOGLE_SCRIPT_URL}?uuid=${encodeURIComponent(uuid)}&callback=${callbackName}`;
            script.onerror = () => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('result').innerHTML = `<span class="error">❌ เชื่อมต่อไม่ได้ (ตรวจสอบ URL Script)</span>`;
            };
            document.body.appendChild(script);
        }

        function handleResponse(status) {
            console.log('Response was called');
            document.getElementById('loading').style.display = 'none';
            const resultDiv = document.getElementById('result');

            if (status === "OK") {
                resultDiv.innerHTML = `<span class="success">✅ สถานะปกติ (OK)</span>`;
                sendMessageToLine("OK");
            } else {
                resultDiv.innerHTML = `<span class="error">❌ กรุณาติดต่อ Admin</span>`;
                sendMessageToLine("ติดต่อ admin");
            }
        }

        function sendMessageToLine(msg) {
            if (liff.isInClient()) {
                liff.sendMessages([{ type: 'text', text: msg }])
                    .then(() => setTimeout(() => liff.closeWindow(), 2000));
            }
        }

        main();
    </script>
</body>
</html>
